<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch</title>
<style>
  /* Paste the :root block from `python scripts/charter.py --format css` here. */
  :root { --bg:#FAF8F3; --surface:#fff; --border:#E5E0D6; --text:#1F1B16; --text-muted:#6B6254; --primary:#185C4A; --on-primary:#fff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, sans-serif; padding: 24px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .frame { background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 16px; }
  .mobile { width: 390px; max-width: 100%; } .wide { width: 960px; max-width: 100%; }
  .ph { background: repeating-linear-gradient(45deg, var(--border) 0 6px, transparent 6px 12px); border-radius: 6px; min-height: 120px; display: grid; place-items: center; color: var(--text-muted); }
  .btn { display: inline-block; background: var(--primary); color: var(--on-primary); padding: 10px 18px; border-radius: 6px; }
  h2 { margin: 0 0 8px; font-size: 1.25rem; } .note { color: var(--text-muted); font-size: .875rem; }
</style>
</head>
<body>
<p class="note">Low-fidelity sketch: structure only. Replace regions with the chosen layout; label each by role.</p>
<div class="row">
  <div class="frame mobile"><h2>Mobile</h2><div class="ph">hero: main content + primary action</div><p><span class="btn">Primary action</span></p></div>
  <div class="frame wide"><h2>Wide</h2><div class="ph">hero (split) · proof · section 1</div></div>
</div>
</body>
</html>
